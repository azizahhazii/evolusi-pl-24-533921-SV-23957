name: Frontend CI/CD
on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gerbang 1 -- paling cepat, jadi paling depan
  lint:
    name: Frontend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint

  # Gerbang 2 -- unit test Vitest, TANPA Laravel berjalan
  test:
    name: Frontend Test
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  # Gerbang 3 -- satu-satunya tempat npm run build dijalankan
  build:
    name: Frontend Build
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          # Bukan rahasia: nilai VITE_* akan tertanam di dist/ dan bisa dibaca siapa pun.
          VITE_API_URL: ${{ vars.VITE_API_URL || 'http://127.0.0.1:8000' }}
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Simpan dist/ sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error

  # Gerbang 4 -- TIDAK build ulang: deploy ke Vercel menggunakan artifact dist/
  deploy:
    name: Frontend Deploy (Vercel)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

  # Gerbang 4 -- TIDAK build ulang: tidak ada checkout, setup-node, npm ci, atau npm run build
  deploy:
    name: Frontend Deploy
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ambil dist/ dari job build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: frontend/dist

      - name: Tampilkan isi dist/
        run: |
          echo "== Isi dist/ (hasil job build, tidak dibangun ulang) =="
          ls -laR frontend/dist
          echo
          find frontend/dist -type f | sort
          echo
          du -sh frontend/dist

      - name: Deploy dist/ ke Vercel tanpa build ulang
        working-directory: ./frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npm install --global vercel
          vercel pull --yes --environment=production --token=$VERCEL_TOKEN
          vercel deploy --prebuilt --prod --token=$VERCEL_TOKEN
          path: dist
      - name: Tampilkan isi dist/
        run: |
          echo "== Isi dist/ (hasil job build, tidak dibangun ulang) =="
          ls -laR dist
          echo
          find dist -type f | sort
          echo
          du -sh dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
